<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f80ed">
<title>Smart Kids квест</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#eef4ff;--card:#fff;--ink:#1d2340;--muted:#6b7394;--line:#e3e8f5;
  --blue:#2f80ed;--green:#22b864;--orange:#ff8a1f;--pink:#e83e8c;--purple:#7b3fe4;--red:#e5484d;--gold:#ffb800;
  --r:20px;--shadow:0 6px 0 rgba(29,35,64,.08),0 10px 24px rgba(47,128,237,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700}
body{min-height:100vh;background:
  radial-gradient(circle at 10% 0%,#dbe9ff 0,transparent 40%),
  radial-gradient(circle at 100% 30%,#ffe6f1 0,transparent 35%),
  radial-gradient(circle at 0% 100%,#e2fbe9 0,transparent 40%),var(--bg)}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;color:var(--ink)}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.wide{max-width:1100px}
h1,h2,h3{margin:0;font-weight:900}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.ic{display:inline-block;vertical-align:-.17em;flex:none}
.sti{display:inline-block;vertical-align:-.15em;flex:none}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:900;font-size:14px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.medal.m0{background:linear-gradient(#ffd54a,#f0a500)}.medal.m1{background:linear-gradient(#d9e0ee,#97a3c0)}.medal.m2{background:linear-gradient(#f6b27a,#c8743a)}
.tile{display:inline-grid;place-items:center;border-radius:16px;color:#fff;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;text-decoration:none;
  background:var(--blue);color:#fff;font-weight:900;font-size:17px;box-shadow:0 5px 0 #1c5fb8;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c5fb8}
.btn.green{background:var(--green);box-shadow:0 5px 0 #168a49}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 #c96200}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #b02066}
.btn.red{background:var(--red);box-shadow:0 5px 0 #a82c30}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.field{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:17px;outline:none}
.field:focus{border-color:var(--blue)}
label.lbl{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:13px;background:#f1f4fb;color:var(--muted)}
.chip.ok{background:#dcf7e7;color:#137a3f}.chip.wait{background:#fff1d6;color:#a86400}.chip.bad{background:#ffe0e1;color:#b3262b}
.chip.blue{background:#dfeafe;color:#1c5fb8}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px 0 8px}
.logo svg{width:110px;height:110px}
.logo .t{font-size:30px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.bar{height:14px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,var(--gold));border-radius:99px;transition:width .5s}
.bar.light{background:#eef1f8}.bar.light>i{background:linear-gradient(90deg,var(--green),#7be3a6)}
.ava{border-radius:50%;object-fit:cover;background:#dfe7f7;flex:none;display:inline-grid;place-items:center;color:#fff;font-weight:900;overflow:hidden}
.modal{position:fixed;inset:0;background:rgba(20,25,50,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .2s}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.x{background:#f1f4fb;width:38px;height:38px;border-radius:12px;color:var(--muted);flex:none;display:inline-grid;place-items:center}
.big-ic{display:flex;justify-content:center}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-140px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
.spinner{width:42px;height:42px;border:5px solid #d6e4fb;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:60px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfd6e6;border-radius:99px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{transform:translateX(22px)}
.mode{font-size:12px;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
.mode:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.mode.demo{background:#fff1d6;color:#a86400}.mode.live{background:#dcf7e7;color:#137a3f}

.hero{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-radius:24px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.me-ava{position:relative;flex:none}
.me-ava .ava{border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.me-ava .lv{position:absolute;right:-6px;bottom:-4px;background:#fff;color:var(--purple);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.score{background:#fff;color:var(--ink);border-radius:14px;padding:6px 12px;font-size:20px;font-weight:900;flex:none;position:relative;z-index:1;display:flex;align-items:center;gap:6px}
.announce{background:#fff8e1;border:2px dashed #ffcf5c;border-radius:16px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.announce .ic{color:#c98a00;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.st{background:#fff;border-radius:20px;padding:16px 12px 12px;box-shadow:var(--shadow);text-align:center;position:relative;border:3px solid transparent;transition:transform .1s;color:var(--ink)}
.st:active{transform:scale(.97)}
.st .tt{font-size:15px;font-weight:900;margin-top:8px;line-height:1.2}
.st .pt{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.st .badge{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff}
.st.done{border-color:#9fe3bb;background:#f3fdf7}.st.done .badge{background:var(--green)}
.st.wait{border-color:#ffd88a;background:#fffaf0}.st.wait .badge{background:var(--orange)}
.st.bad{border-color:#ffb3b5}.st.bad .badge{background:var(--red)}
.st .ty{position:absolute;top:8px;left:8px;font-size:11px;padding:2px 7px;border-radius:99px;background:#f1f4fb;color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 20px rgba(29,35,64,.08);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabbar .in{display:flex;max-width:560px;width:100%;gap:6px}
.tabbar button{flex:1;background:none;border-radius:14px;padding:8px 4px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{background:#eaf2ff;color:var(--blue)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#f6f8fd;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-size:17px;font-weight:800;margin-top:10px;color:var(--ink);transition:background .2s,border-color .2s}
.opt .k{width:30px;height:30px;border-radius:10px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
.opt.right{background:#dcf7e7;border-color:var(--green)}.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:#ffe0e1;border-color:var(--red);animation:shake .4s}.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}
.dots i{width:30px;height:8px;border-radius:99px;background:#e3e8f5}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.cur{background:var(--blue)}
.qtext{font-size:19px;text-align:center;margin:12px 0 4px;line-height:1.3}
.res{display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left}
.res div{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.res .ic{margin-top:2px}
.slots{display:flex;flex-direction:column;gap:8px;min-height:60px;background:#f6f8fd;border:3px dashed var(--line);border-radius:16px;padding:10px}
.slot{background:#fff;border:2px solid #b9d3fb;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;font-size:16px;width:100%;color:var(--ink)}
.slot .n{background:var(--blue);color:#fff;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:none}
.pool{display:flex;flex-direction:column;gap:8px}
.pool .slot{border-color:var(--line)}
.shot{width:100%;border-radius:18px;display:block;max-height:50vh;object-fit:contain;background:#f1f4fb}
.camgo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;border:3px dashed #b9d3fb;background:#f3f8ff;border-radius:20px;padding:26px;color:var(--blue);font-weight:900;font-size:17px}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{flex:1;background:none;padding:10px 6px;border-radius:10px;color:var(--muted);font-size:14px}
.seg button.on{background:var(--blue);color:#fff}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .pl{width:30px;text-align:center;font-size:16px;font-weight:900;color:var(--muted);flex:none;display:grid;place-items:center}
.li.me{background:#fff8e1;border-radius:12px;padding-left:8px;padding-right:8px}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li b{display:flex;align-items:center;gap:4px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:16px 0 4px}
.podium>div{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center}
.podium .ped{width:100%;border-radius:16px 16px 6px 6px;color:#fff;padding:10px 4px;text-align:center;margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.podium .ped .medal{background:rgba(255,255,255,.3);box-shadow:none}
.podium .p1 .ped{background:linear-gradient(180deg,#ffcf3f,#ff9f00);height:96px}
.podium .p2 .ped{background:linear-gradient(180deg,#c5d0e6,#8d9bbd);height:72px}
.podium .p3 .ped{background:linear-gradient(180deg,#ffb77a,#d9783a);height:56px}
.podium .ava{border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.podium .nm{font-size:13px;line-height:1.15;text-align:center;margin-top:4px;word-break:break-word}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bdg{background:#fff;border-radius:20px;padding:16px 10px;text-align:center;box-shadow:var(--shadow)}
.bdg .tile{margin-bottom:8px}
.bdg.off{opacity:.4;filter:grayscale(1)}
.ava-pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:150px;height:150px;margin:6px auto 0;border-radius:50%;border:4px dashed #b9d3fb;background:#f3f8ff;color:var(--blue);overflow:hidden;padding:0;position:relative}
.ava-pick img{width:100%;height:100%;object-fit:cover}
.ava-pick.has{border:5px solid var(--green)}
.ava-pick .re{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);color:#fff;font-size:12px;padding:4px 0 8px}
/* камера */
#cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;color:#fff}
.cam-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.cam-top b{font-size:16px;text-align:center;flex:1}
.cbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;flex:none;display:grid;place-items:center}
.cam-view{flex:1;position:relative;overflow:hidden;background:#111}
.cam-view video,.cam-view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-view .mirror{transform:scaleX(-1)}
.cam-view.sq .cam-mask{position:absolute;left:50%;top:50%;width:min(78vw,58vh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:4px dashed rgba(255,255,255,.9);box-shadow:0 0 0 200vmax rgba(0,0,0,.55);pointer-events:none}
.cam-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:17px}
.cam-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:15px;text-shadow:0 1px 4px #000;pointer-events:none}
.cam-bot{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 16px calc(22px + env(safe-area-inset-bottom));min-height:116px}
.cam-bot .btn{flex:1;max-width:220px}
.shutter{width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35);transition:transform .1s}
.shutter:active{transform:scale(.9)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45;transition:opacity .25s}
/* ойын түрлері */
.intro{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--purple);background:#f0e9ff;padding:5px 11px;border-radius:99px}
.tmr{flex:1;height:12px;background:#eef1f8;border-radius:99px;overflow:hidden}
.tmr i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22b864,#7be3a6);border-radius:99px;transition:width .1s linear}
.tmr i.hot{background:linear-gradient(90deg,#e5484d,#ff8a8d);animation:pulse .5s infinite alternate}
#tnum{width:26px;text-align:right;font-size:18px}
@keyframes pulse{to{opacity:.55}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tf button{border-radius:20px;padding:22px 10px;font-size:20px;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s,opacity .2s}
.tf button:active{transform:translateY(4px)}
.tf .y{background:var(--green);box-shadow:0 6px 0 #168a49}.tf .n{background:var(--red);box-shadow:0 6px 0 #a82c30}
.tf .dim{opacity:.3}.tf .sel{outline:4px solid var(--ink);outline-offset:3px}
.bslots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px;padding:10px;border:3px dashed var(--line);border-radius:16px;background:#f6f8fd;margin-top:12px}
.bslots.ok{border-color:var(--green);background:#ecfbf2}.bslots.no{border-color:var(--red);background:#fff2f2}
.bslots.bad{animation:shake .4s;border-color:var(--red)}
.bpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.bslots.col,.bpool.col{flex-direction:column;align-items:stretch}
.lt{min-width:44px;height:52px;border-radius:12px;background:#fff;border:2px solid #b9d3fb;font-size:24px;font-weight:900;color:var(--ink);box-shadow:0 4px 0 #b9d3fb;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.lt:active{transform:translateY(3px);box-shadow:0 1px 0 #b9d3fb}
.lt.ph{font-size:17px;height:46px}
.lt.rw{font-size:16px;height:auto;min-height:46px;padding:8px 12px;justify-content:flex-start;text-align:left;width:100%}
.lt .nn{background:var(--blue);color:#fff;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none}
.lt.empty{background:transparent;border:2px dashed #c9d3e8;box-shadow:none}.lt.empty .nn{background:#cfd6e6}
.lt.gone{opacity:.25;box-shadow:none}
.bslots.ok .lt{border-color:var(--green);box-shadow:0 4px 0 var(--green);background:#dcf7e7}
.bslots.no .lt{border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.match .mc{display:flex;flex-direction:column;gap:8px}
.mb{border-radius:14px;border:3px solid var(--line);background:#f6f8fd;padding:10px 8px;font-size:15px;font-weight:800;text-align:center;color:var(--ink);min-height:58px}
.mb.r{background:#fff8e6}
.mb.sel{border-color:var(--blue);background:#eaf2ff;transform:scale(1.03)}
.mb.done{border-color:var(--green);background:#dcf7e7;color:#137a3f}
.mb.bad{border-color:var(--red);background:#ffe0e1;animation:shake .4s}
.fb{margin-top:14px;border-radius:16px;padding:12px 14px;text-align:center;font-weight:900;font-size:18px;animation:pop .35s;display:block}
.fb.ok{background:#dcf7e7;color:#137a3f}.fb.no{background:#ffe0e1;color:#b3262b}.fb.warn{background:#fff1d6;color:#a86400;font-size:16px}
.fb small{display:block;font-weight:700;font-size:14px;color:var(--ink);margin-top:4px}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.count{font-size:130px;font-weight:900;text-align:center;line-height:1.1;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .5s}
.aw{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;color:#fff;font-size:12px;font-weight:900;white-space:nowrap}
.awban{display:flex;align-items:center;gap:12px;width:100%;border-radius:20px;padding:14px;color:#fff;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:var(--shadow);font-size:15px;animation:pop .5s}
.langchip{background:rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:900;margin-left:2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="cam" class="hidden"></div>
<div id="flash"></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<script>
/* =========================================================
   БАПТАУ — ҮШ ФАЙЛДА БІРДЕЙ БОЛУЫ КЕРЕК
   (index.html, admin.html, board.html)
   Firebase Console → Project settings → Your apps → Config
   Бос қалса — «Демо режим» (тек осы браузерде жұмыс істейді).

const LocalDB=(()=>{
  const subs=[];const key=c=>"skdemo_"+c;
  const load=c=>{try{return JSON.parse(localStorage.getItem(key(c))||"{}")}catch(e){return {}}};
  const save=(c,o)=>{try{localStorage.setItem(key(c),JSON.stringify(o))}catch(e){toast("Демо режимде жад толды. Firebase қосыңыз.");throw e}notify(c)};
  const fire=s=>{const o=load(s.col);
    if(s.docId){const d=o[s.docId];s.cb(d?{id:s.docId,...d}:null);return}
    let a=Object.entries(o).map(([id,d])=>({id,...d}));if(s.filter)a=a.filter(d=>d[s.filter[0]]===s.filter[1]);s.cb(a)};
  const notify=c=>subs.filter(s=>s.col===c).forEach(fire);

    set:async(col,id,data,merge)=>{const o=load(col);o[id]=merge?{...(o[id]||{}),...data}:data;save(col,o)},

    all:async col=>Object.entries(load(col)).map(([id,d])=>({id,...d}))

  arr.forEach(p=>{const sc=p.score||0;if(sc!==prev){rank++;prev=sc}p._pl=rank});
  const best={};arr.forEach(p=>{if(best[p.cls]===undefined)best[p.cls]=p.score||0});
  return arr.map(p=>{const sc=p.score||0;let a;
    if(sc>0&&p._pl<=3)a=["d1","d2","d3"][p._pl-1];

let pendingRender=null;
function schedule(fn){const a=document.activeElement;
  if(a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!/^(checkbox|radio|file|button)$/.test(a.type)){pendingRender=fn;return}
  fn()}

function confetti(n=140){const c=$("#confetti");if(!c)return;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#2f80ed","#22b864","#ff8a1f","#e83e8c","#7b3fe4","#ffb800"];
  const P=Array.from({length:n},()=>({x:c.width/2,y:c.height/2.4,vx:(Math.random()-.5)*16,vy:Math.random()*-15-4,s:Math.random()*9+4,c:cols[Math.random()*6|0],r:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
  if(++f<120)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

/* суретті сығу / кесу */
function drawTo(src,sw,sh,{max=1000,square=false,mirror=false,limit=650000}={}){
  let sx=0,sy=0,cw=sw,ch=sh;
  if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;cw=ch=m}
  const k=Math.min(1,max/Math.max(cw,ch));const w=Math.round(cw*k),h=Math.round(ch*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
  if(mirror){x.translate(w,0);x.scale(-1,1)}
  x.drawImage(src,sx,sy,cw,ch,0,0,w,h);
  let q=.78,d=c.toDataURL("image/jpeg",q);while(d.length>limit&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}return d}
function fileToImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Сурет ашылмады"));i.src=r.result};r.readAsDataURL(file)})}

   ========================================================= */
const CAM={stream:null,facing:"environment",opts:{},resolve:null,shot:null};
function openCamera(opts){
  return new Promise(res=>{
    CAM.resolve=res;CAM.opts=opts||{};CAM.facing=CAM.opts.facing||"environment";CAM.shot=null;
    const el=$("#cam");el.classList.remove("hidden");document.body.style.overflow="hidden";
    el.innerHTML=`<div class="cam-top"><button class="cbtn" onclick="camClose(null)" aria-label="${_("Жабу")}">${ic("x",22)}</button><b>${esc(CAM.opts.title||"Камера")}</b><button class="cbtn" onclick="camSwitch()" aria-label="${_("Камераны ауыстыру")}">${ic("refresh",22)}</button></div>
     <div class="cam-view ${CAM.opts.square?"sq":""}"><video id="camV" playsinline muted autoplay></video><img id="camI" class="hidden" alt=""><div class="cam-mask"></div>
      <div id="camMsg" class="cam-msg">${ic("camera",52)}${_("Камера ашылуда…")}</div><div class="cam-hint" id="camHint">${esc(CAM.opts.hint||"")}</div></div>
     <div class="cam-bot" id="camBot"></div>
     <input id="camF" type="file" accept="image/*" capture="${CAM.facing==="user"?"user":"environment"}" hidden onchange="camFile(this)">`;
    camBot();startStream();
  });
}
function camBot(){const b=$("#camBot");if(!b)return;
  b.innerHTML=CAM.shot?`<button class="btn ghost" onclick="camRetake()">${ic("refresh")} ${_("Қайта")}</button><button class="btn green" onclick="camClose(CAM.shot)">${ic("check")} ${_("Дайын")}</button>`
   :`<button class="shutter" id="shutter" onclick="camSnap()" aria-label="${_("Суретке түсіру")}"></button>`}
function stopStream(){if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}}
async function startStream(){
  stopStream();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return camFallback();
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:CAM.facing},width:{ideal:1280},height:{ideal:1280}},audio:false});
    if($("#cam").classList.contains("hidden")){s.getTracks().forEach(t=>t.stop());return}
    CAM.stream=s;const v=$("#camV");v.srcObject=s;v.classList.toggle("mirror",CAM.facing==="user");
    await v.play().catch(()=>{});$("#camMsg").style.display="none";
  }catch(e){console.warn(e);camFallback(e)}
}
function camFallback(e){
  const m=$("#camMsg");if(!m)return;m.style.display="";
  const denied=e&&(e.name==="NotAllowedError"||e.name==="SecurityError");
  m.innerHTML=`${ic("camera",52)}<p style="margin:0">${denied?`${_("Камераға рұқсат берілмеді.")}<br><span style='font-size:14px;opacity:.8'>${_("Браузердің мекенжай жолындағы құлып белгісі арқылы рұқсат беріңіз немесе:")}</span>`:_("Камера осы жерде ашылмады.")}</p>
   <label class="btn" for="camF">${ic("camera")} ${_("Телефон камерасын ашу")}</label>`;
  const sh=$("#shutter");if(sh)sh.style.visibility="hidden";
}
function camSnap(){
  const v=$("#camV");if(!v||!v.videoWidth)return toast(_("Камера әлі дайын емес"));
  CAM.shot=drawTo(v,v.videoWidth,v.videoHeight,{max:CAM.opts.max||1000,square:!!CAM.opts.square,mirror:CAM.facing==="user",limit:CAM.opts.square?70000:650000});
  const f=$("#flash");f.style.opacity=.9;setTimeout(()=>f.style.opacity=0,60);
  v.pause();showShot();
}
function showShot(){const i=$("#camI");i.src=CAM.shot;i.classList.remove("hidden");$("#camV").classList.add("hidden");$("#camHint").style.display="none";camBot()}
async function camFile(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  try{const img=await fileToImage(f);CAM.shot=drawTo(img,img.naturalWidth,img.naturalHeight,{max:CAM.opts.max||1000,square:!!CAM.opts.square,limit:CAM.opts.square?70000:650000});$("#camMsg").style.display="none";showShot()}catch(e){toast(e.message)}}
function camRetake(){CAM.shot=null;$("#camI").classList.add("hidden");const v=$("#camV");v.classList.remove("hidden");$("#camHint").style.display="";camBot();
  if(CAM.stream)v.play().catch(()=>{});else startStream()}
function camSwitch(){CAM.facing=CAM.facing==="user"?"environment":"user";$("#camF").setAttribute("capture",CAM.facing==="user"?"user":"environment");if(CAM.shot)camRetake();else startStream()}
function camClose(val){stopStream();const el=$("#cam");el.classList.add("hidden");el.innerHTML="";if($("#modal").classList.contains("hidden"))document.body.style.overflow="";
  const r=CAM.resolve;CAM.resolve=null;r&&r(val)}

let AC=null;
function soundOn(){try{return localStorage.getItem("sk_snd")!=="0"}catch(e){return true}}

function sfx(n){if(!soundOn())return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const seq={ok:[[660,.09],[990,.16]],bad:[[196,.3]],tick:[[1100,.05]],count:[[523,.14]],go:[[784,.25]],win:[[523,.1],[659,.1],[784,.1],[1047,.3]],tap:[[700,.03]]}[n]||[];
  let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=n==="bad"?"sawtooth":"triangle";o.frequency.value=f;
   g.gain.setValueAtTime(n==="tap"?.05:.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85})}catch(e){}}

  const c={k,done:false,ok:null,pick:-1,picked:[],pool:[],tries:0,sel:null,matched:[],miss:0,bad:null,shake:false,note:"",msg:""};
  if(k==="choice")c.perm=shuffle(q.options.map((_,i)=>i));
  if(k==="word"||k==="phrase"||k==="order"){const u=qUnits(q);let p=shuffle(u.map((_,i)=>i));
    if(p.length>1&&p.every((v,i)=>u[v]===u[i]))p=[...p.slice(1),p[0]];c.pool=p}
  if(k==="match"){c.left=shuffle(q.pairs.map((_,i)=>i));c.right=shuffle(q.pairs.map((_,i)=>i));
    if(c.right.length>1&&c.right.every((v,i)=>v===c.left[i]))c.right=[...c.right.slice(1),c.right[0]]}
  T.cur=c;refreshTask();startTimer();
}
function startTimer(){
  stopTimer();const sec=T.t.timer||0;if(!sec)return;
  T.deadline=Date.now()+sec*1000;T.lastTick=99;const c=T.cur;
  T.tmr=setInterval(()=>{if(!T||T.cur!==c||c.done){stopTimer();return}
    const left=T.deadline-Date.now();paintTimer();
    const s=Math.ceil(left/1000);if(s<=3&&s>0&&s!==T.lastTick){T.lastTick=s;sfx("tick")}
    if(left<=0){stopTimer();resolveQ(false,_("(уақыт бітті)"),true)}},100);
}
function paintTimer(){const sec=T.t.timer||0;if(!sec)return;const left=Math.max(0,T.deadline-Date.now());
  const bar=$("#tbar"),num=$("#tnum");if(bar){bar.style.width=(left/(sec*10))+"%";bar.classList.toggle("hot",left<=4000)}if(num)num.textContent=Math.ceil(left/1000)}
function stopTimer(){if(T&&T.tmr){clearInterval(T.tmr);T.tmr=null}}
function resolveQ(ok,given,timeout){
  const c=T.cur;if(!c||c.done)return;c.done=true;c.ok=ok;stopTimer();
  const sec=T.t.timer||0,fast=ok&&sec&&(T.deadline-Date.now())>sec*500;
  T.res.push(ok);T.given.push(String(given||"—"));if(fast)T.bonus++;
  T.streak=ok?T.streak+1:0;T.best=Math.max(T.best,T.streak);
  const PR=LANG==="ru"?PRAISE_RU:PRAISE_KK;c.msg=timeout?`${ic("clock",18)} ${_("Уақыт бітті!")}`:ok?(fast?`${ic("zap",18)} ${_("Жылдам! +1 бонус")}`:T.streak>=3?`${ic("zap",18)} ${R_(`Қатарынан ${T.streak} дұрыс!`,`${T.streak} верных подряд!`)}`:`${ic("check",18)} ${PR[Math.random()*PR.length|0]}`):`${ic("x",18)} ${_("Қате болды")}`;
  sfx(ok?"ok":"bad");if(ok)confetti(T.streak>=3||fast?110:45);else if(navigator.vibrate)navigator.vibrate(160);
  refreshTask();
  setTimeout(()=>{if(!T||T.cur!==c)return;if(T.qi+1<T.t.questions.length){T.qi++;startQ()}else finishSet()},ok?1400:2600);
}
/* таңдау / дұрыс-бұрыс */
function qChoice(oi){const c=T&&T.cur;if(!c||c.done)return;c.pick=oi;const q=T.t.questions[T.qi];resolveQ(oi===q.correct,q.options[oi])}
function qTF(v){const c=T&&T.cur;if(!c||c.done)return;const q=T.t.questions[T.qi];resolveQ(v===q.a,v?_("Дұрыс"):_("Бұрыс"))}
/* сөз / мақал / рет құрау — 2 мүмкіндік */
function qPick(v){const c=T&&T.cur;if(!c||c.done)return;c.picked.push(v);c.note="";c.shake=false;sfx("tap");
  const q=T.t.questions[T.qi],u=qUnits(q);
  if(c.picked.length<u.length)return refreshTask();
  const got=c.picked.map(i=>u[i]),ok=got.every((x,i)=>x===u[i]);
  const given=got.join(c.k==="word"?"":c.k==="phrase"?" ":" → ");
  if(ok)return resolveQ(true,given);
  if(c.tries<1){c.tries++;c.shake=true;c.note=_("Сәл қате! Тағы бір мүмкіндік бар");sfx("bad");if(navigator.vibrate)navigator.vibrate(100);
    refreshTask();setTimeout(()=>{if(T&&T.cur===c&&!c.done){c.picked=[];c.shake=false;refreshTask()}},700);return}
  resolveQ(false,given)}
function qUnpick(i){const c=T&&T.cur;if(!c||c.done)return;c.picked.splice(i,1);c.note="";refreshTask()}
/* сәйкестендіру — 2 қатеге дейін */
function qMatchL(i){const c=T&&T.cur;if(!c||c.done)return;c.sel=c.sel===i?null:i;c.bad=null;sfx("tap");refreshTask()}
function qMatchR(j){const c=T&&T.cur;if(!c||c.done)return;if(c.sel===null){toast(_("Алдымен сол жақтан таңда"));return}
  const q=T.t.questions[T.qi];
  if(c.sel===j){c.matched.push(j);c.sel=null;c.bad=null;sfx("tap");
    if(c.matched.length===q.pairs.length)return resolveQ(true,_("барлығы сәйкес"));
    return refreshTask()}
  c.miss++;c.bad=[c.sel,j];c.sel=null;sfx("bad");if(navigator.vibrate)navigator.vibrate(100);
  if(c.miss>=2)return resolveQ(false,`${c.matched.length}/${q.pairs.length} ${_("жұп")}`);
  refreshTask();setTimeout(()=>{if(T&&T.cur===c&&!c.done){c.bad=null;refreshTask()}},600)}
async function finishSet(){
  const t=T.t,qs=t.questions;const correct=T.res.filter(Boolean).length;
  const pts=correct*(t.points||2)+T.bonus;
  const sub={playerId:S.me.id,name:S.me.name,cls:S.me.cls,lang:LANG,taskId:t.id,type:"set",status:"ok",points:pts,correct,total:qs.length,bonus:T.bonus,best:T.best,res:T.res,given:T.given,ts:Date.now()};
  try{await DB.set("sk_subs",S.me.id+"_"+t.id,sub);if(pts)await DB.inc("sk_players",S.me.id,"score",pts)}catch(e){toast(_("Қате: ")+e.message);return}
  S.subs[t.id]=sub;T.live=false;T.phase="done";sfx(correct===qs.length?"win":"ok");confetti(correct===qs.length?240:120);
  toast(correct===qs.length?`${_("Мінсіз!")} ${correct}/${qs.length} · +${starsL(pts)}`:`${correct} / ${qs.length} ${_("дұрыс")}! +${starsL(pts)}`,3200);refreshTask();
}

function hint(){return T.att>0?`<p class="center mt" style="color:var(--orange)">${_("Тағы байқап көр!")} +${starsL(Math.ceil(T.t.points/2))}</p>`:""}
async function shootTask(){
  const t=T&&T.t;if(!t)return;
  const d=await openCamera({facing:"environment",max:1000,title:t.title,hint:_("Барлығы кадрға сыйсын")});
  if(d&&T&&T.t===t){T.photo=d;refreshTask()}
}
async function win(extra){
  const t=T.t;if(isDone(S.subs[t.id]))return;
  const pts=T.att===0?t.points:Math.ceil(t.points/2);
  const sub={playerId:S.me.id,name:S.me.name,cls:S.me.cls,taskId:t.id,type:t.type,status:"ok",points:pts,attempts:T.att+1,ts:Date.now(),...(extra||{})};
  try{await DB.set("sk_subs",S.me.id+"_"+t.id,sub);await DB.inc("sk_players",S.me.id,"score",pts)}catch(e){return toast(_("Қате: ")+e.message)}
  S.subs[t.id]=sub;confetti();toast(`${_("Керемет!")} +${starsL(pts)}`);refreshTask();
}
function wrong(){if(navigator.vibrate)navigator.vibrate(120)}
function answerQuiz(i){if(i===T.t.correct)return win();T.att++;T.wrong=i;refreshTask();wrong()}
function answerText(){const raw=$("#txtAns").value,v=norm(raw);if(!v)return toast(_("Жауап жаз"));
  if((T.t.answers||[]).some(a=>{const n=norm(a);return n&&(v===n||v.includes(n))}))return win({answer:raw.trim()});
  T.att++;refreshTask();toast(_("Жоқ, тағы ойлан"));wrong()}
function pick(v){T.picked.push(v);refreshTask()}
function unpick(i){T.picked.splice(i,1);refreshTask()}
function answerOrder(){if(T.picked.every((v,i)=>v===i))return win();T.att++;T.picked=[];refreshTask();toast(_("Реті дұрыс емес. Қайтадан!"));wrong()}
async function sendPhoto(){
  if(!T||!T.photo||T.busy)return;T.busy=true;refreshTask();
  const t=T.t,id=S.me.id+"_"+t.id;
  try{
    await DB.set("sk_photos",id,{data:T.photo,playerId:S.me.id,taskId:t.id,ts:Date.now()});
    await DB.set("sk_subs",id,{playerId:S.me.id,name:S.me.name,cls:S.me.cls,lang:LANG,taskId:t.id,type:"photo",status:"pending",points:0,ts:Date.now(),comment:""});
    if(T){T.photo=null;T.busy=false}confetti(60);toast(_("Сурет мұғалімге жіберілді!"));
  }catch(e){if(T){T.busy=false;refreshTask()}toast(_("Жіберілмеді: ")+e.message,4000)}
}
document.documentElement.lang=LANG;
start();
</script>
